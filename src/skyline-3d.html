<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />

    <link rel="stylesheet" href="study.css" />
    <title>3D Chicago Skyline</title>

  </head>
  <body class="skyline-3d">
    <main class="viewport" id="viewport">
      <canvas id="building" tabindex="0" role="img" aria-label="Interactive 3D Chicago skyline: every mapped building of the skyline study, seen from the drawing's camera on the lakefront by the Adler Planetarium" aria-describedby="camera-hint"></canvas>

          <use class="skyline-trace-rail" href="#skyline-loading-outline" />
          <use class="skyline-trace-line" href="#skyline-loading-outline" />
          <use class="skyline-trace-tip" href="#skyline-loading-outline" />
        </svg>
        <!-- skyline-loading:end -->
      </div>
      <div class="scene-notes" id="scene-notes">
        <p class="hint" id="camera-hint">Drag to orbit · scroll or pinch to zoom<br />Arrow keys rotate · + / − zoom · Home resets</p>
        <p id="celebration-status" aria-hidden="true" hidden></p>
        <p class="attribution">Streets and footprints <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></p>
      </div>
      <p class="visually-hidden" id="motion-status" role="status">Camera moves only when you interact or start the turntable.</p>
      <p class="visually-hidden" id="celebration-announcement" role="status"></p>
      <noscript><style>#loading { display: none; }</style><p class="loading">Enable JavaScript to explore the 3D skyline.</p></noscript>
      <section class="detail-panel" id="building-detail" role="dialog" aria-label="Building detail" hidden>
        <button type="button" class="detail-close" id="detail-close" data-ct="skyline.detail-close" aria-label="Close building detail" title="Close (Esc)">×</button>
      </section>
    </main>
    <footer class="control-bar" aria-label="3D skyline controls">
      <!-- Chicago's six-pointed star, after devopsrockstars' white-star-only.svg, drawn in
           the bar's muted grey: points 12 units out, the notches between them 4.66. -->
      <button type="button" class="menu-toggle" id="menu-toggle" data-ct="skyline.menu-toggle" aria-expanded="false" aria-controls="camera-views model-display scene-notes" aria-label="Skyline controls" title="Show the controls">
        <svg viewBox="-12 -12 24 24" aria-hidden="true" focusable="false"><path d="M0-12 2.33-4.04 10.39-6 4.66 0 10.39 6 2.33 4.04 0 12-2.33 4.04-10.39 6-4.66 0-10.39-6-2.33-4.04Z" /></svg>
      </button>
      <div class="button-group camera-views" id="camera-views" role="group" aria-label="Camera views">
        <button type="button" data-view="skyline" data-ct="skyline.view.skyline" aria-pressed="true">skyline view</button>
        <button type="button" data-view="quarter" data-ct="skyline.view.quarter" aria-pressed="false">three-quarter</button>
        <button type="button" data-view="side" data-ct="skyline.view.side" aria-pressed="false">side</button>
        <button type="button" data-view="top" data-ct="skyline.view.top" aria-pressed="false">ground plan ↓</button>
        <button type="button" data-view="heights" data-ct="skyline.view.heights" aria-pressed="false">height comparison</button>
        <button type="button" id="reset" data-ct="skyline.reset">reset view</button>
      </div>
      <div class="button-group model-display" id="model-display" role="group" aria-label="Model display">
        <button type="button" id="streets" data-ct="skyline.streets" aria-pressed="true">streets</button>
        <button type="button" id="footprints" data-ct="skyline.footprints" aria-pressed="false">footprints</button>
        <button type="button" id="wireframe" data-ct="skyline.wireframe" aria-pressed="false">wireframe</button>
        <button type="button" id="colour" data-ct="skyline.colour" aria-pressed="false" title="Colour trial: a sunny day, each measured building in its photographed colours; the rest stay grey">colour</button>
        <button type="button" id="turntable" data-ct="skyline.turntable" aria-pressed="false" aria-describedby="motion-status">turntable</button>
        <button type="button" id="show-original" data-ct="skyline.show-original" title="Compare with the original skyline SVG" hidden>show original</button>
        <div class="time-controls">
          <label for="time-of-day"><span id="time-caption">Chicago time</span> <span id="time-date"></span></label>
          <input id="time-of-day" type="range" min="0" max="1439" step="1" value="0" aria-labelledby="time-caption" />
          <output id="time-value" for="time-of-day" aria-live="off">original night</output>
          <button type="button" id="reset-light" data-ct="skyline.reset-light" disabled title="Restore the original lighting preset">reset light</button>
        </div>
        <div class="celebration-controls" id="celebration-controls" role="group" aria-label="Celebratory window lighting">
          <span class="celebration-caption">lights</span>
          <button type="button" data-celebration="bulls" aria-label="Bulls lighting" aria-pressed="false">
            <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M7 12C3 12 2 8 3 4c2 4 4 4 7 5l6-2 6 2c3-1 5-1 7-5 1 4 0 8-4 8l-2 10-4 5h-6l-4-5Z"/><path class="logo-cut" d="m9 15 5 2m9-2-5 2m-4 6h4"/></svg>
          </button>
          <button type="button" data-celebration="cubs" aria-label="Cubs lighting" aria-pressed="false">
            <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="logo-line" cx="16" cy="16" r="13"/><path d="M24 10a10 10 0 1 0 0 12l-4-3a5 5 0 1 1 0-6Z"/></svg>
          </button>
          <button type="button" data-celebration="sox" aria-label="White Sox lighting" aria-pressed="false">
            <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><text x="2" y="13">S</text><text x="11" y="22">O</text><text x="21" y="30">X</text></svg>
          </button>
          <button type="button" data-celebration="bears" aria-label="Bears lighting" aria-pressed="false">
            <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="m3 16 5-8 11-2 10 5-7 3-4-3-7 2-2 3 2 3 7 2 4-3 7 3-10 5-11-2Z"/></svg>
          </button>
          <button type="button" data-celebration="hawks" aria-label="Blackhawks lighting" aria-pressed="false">
            <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="logo-line" d="M10 5h12v7c0 5-3 7-6 7s-6-2-6-7ZM10 7H5v4c0 4 3 5 6 5m11-9h5v4c0 4-3 5-6 5m-5 3v6m-6 2h12"/></svg>
          </button>
          <button type="button" data-celebration="thanks" aria-label="Thanksgiving lighting" aria-pressed="false">
            <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="logo-line" d="M8 27 24 4M12 21C2 21 3 12 3 12c7 0 10 4 9 9Zm5-7C8 14 10 6 10 6c6 0 9 4 7 8Zm-3 4c3-6 10-5 13-3-2 6-8 9-13 3Zm6-9c0-5 5-7 8-7 1 6-2 10-8 7Z"/></svg>
          </button>
        </div>
      </div>
    </footer>
    <script>
      // Settings from this page's address, applied before the bar's first frame.
      // ?controls=open starts the bar open, with no fold; skyline-3d.ts folds it from there.
      // ?attribution=hidden leaves out the OpenStreetMap credit. The viewer, which renders this
      // markup in its shadow root, applies its own options the same way (skyline-viewer.ts).
      (() => {
        const settings = new URLSearchParams(location.search);
        const theme = settings.get("theme");
        document.body.dataset.theme = theme === "light" || (theme !== "dark" && settings.get("colour") === "1") ? "light" : "dark";
        if (settings.get("controls") === "open") {
          const toggle = document.querySelector("#menu-toggle");
          toggle.setAttribute("aria-expanded", "true");
          toggle.title = "Hide the controls";
          document.querySelector(".control-bar").classList.add("open");
        }
        if (settings.get("attribution") === "hidden") document.querySelector(".attribution").hidden = true;
      })();
    </script>
    <div class="tooltip" id="tooltip" aria-hidden="true" hidden></div>
    <div class="context-menu" id="building-menu" hidden>
      <p class="context-menu-title" id="building-menu-title"></p>
      <div role="menu" aria-labelledby="building-menu-title">
        <a role="menuitem" id="building-detail-link" data-ct="skyline.building-detail-link" href="building-detail.html">building detail</a>
        <div id="building-lighting-menu" role="group" aria-label="Celebratory window lighting" hidden></div>
      </div>
    </div>
    <!-- The loader is compiled into dist/; opened from the sources, say how to build it. -->
    <script src="study-loader.js" data-study="./skyline-3d-page.js" onerror="document.querySelector('#loading').textContent = 'Build the site with bun run build:site, then serve dist/ with python3 -m http.server -d dist to explore the 3D skyline.'"></script>
  </body>
</html>
