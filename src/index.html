<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:," />
    <title>Chicago Skyline — Living Night</title>
    <!-- viewer-page.js mounts the viewer from skyline-viewer.js, its styles and skyline-3d.html,
         and starts the scene's code; fetch them alongside it. -->
    <link rel="modulepreload" href="skyline-viewer.js" />
    <link rel="preload" href="viewer.css" as="style" />
    <link rel="preload" href="study.css" as="style" />
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      html,
      body,
      main {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      .notice {
        box-sizing: border-box;
        margin: 0;
        padding: 24px;
        color: #aaa;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <!-- The viewer renders into a shadow root inside this element, as in a host's page. -->
    <main id="viewer"><noscript><p class="notice">Enable JavaScript to explore the Chicago skyline.</p></noscript></main>
    <script>
      // Modules do not load from file://, and the sources hold no compiled modules.
      function showNotice(text) {
        const notice = document.createElement("p");
        notice.className = "notice";
        notice.textContent = text;
        document.querySelector("#viewer").replaceChildren(notice);
      }
      if (location.protocol === "file:") showNotice("Start a local server with python3 -m http.server -d dist, then open http://localhost:8000 to explore the skyline.");
    </script>
    <script type="module" src="viewer-page.js" onerror="showNotice('Build the site with bun run build:site, then serve dist/ with python3 -m http.server -d dist to explore the skyline.')"></script>
  </body>
</html>
