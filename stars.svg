  <script><![CDATA[
    const stars = [...document.querySelectorAll("#atmosphere circle")];

    function randomizeTwinkle(star) {
      star.style.setProperty("--twinkle-dim", 0.42 + Math.random() * 0.05);
      star.style.setProperty("--twinkle-peak", 0.54 + Math.random() * 0.06);
      star.style.setProperty("--twinkle-afterglow", 0.47 + Math.random() * 0.06);
    }

    for (const star of stars) {
      star.setAttribute("cx", `${1 + Math.random() * 98}%`);
      star.setAttribute("cy", `${2 + Math.random() * 96}%`);
    }

    // Choose about 10% without replacement, once per load.
    const twinkleCount = Math.round(stars.length * 0.1);
    for (let i = 0; i < twinkleCount; i++) {
      const selected = i + Math.floor(Math.random() * (stars.length - i));
      [stars[i], stars[selected]] = [stars[selected], stars[i]];
      const star = stars[i];
      const duration = 60 + Math.random() * 40;
      star.style.setProperty("--twinkle-duration", `${duration}s`);
      star.style.setProperty("--twinkle-delay", `${-Math.random() * duration}s`);
      randomizeTwinkle(star);
      star.classList.add("twinkle");
    }

    document.querySelector("#atmosphere").addEventListener("animationiteration", (event) => {
      if (event.animationName === "star-twinkle") {
        // The cycle ends at a fixed brightness so the next pattern joins smoothly.
        randomizeTwinkle(event.target);
      }
    });
  ]]></script>
</svg>
