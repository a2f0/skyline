<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="100%"
     role="img" aria-labelledby="stars-title stars-description"
     style="background:#000000;pointer-events:none">
  <title id="stars-title">Twinkling night sky</title>
  <desc id="stars-description">96 grayscale stars spread across the full viewport. Reduced motion pauses the stars; the debug-motion fragment enables an exaggerated preview.</desc>
  <style><![CDATA[
    #atmosphere circle {
      opacity: 0.5;
      transform-box: fill-box;
      transform-origin: center;
      animation: star-twinkle 5.8s ease-in-out infinite;
    }
    #atmosphere .stars-b circle { animation-duration: 7.6s; }
    #atmosphere .stars-c circle { animation-duration: 9.4s; }
    #atmosphere circle:nth-child(3n + 1) { animation-delay: -1.7s; }
    #atmosphere circle:nth-child(3n + 2) { animation-delay: -3.9s; }
    #atmosphere circle:nth-child(3n) { animation-delay: -5.2s; }

    @keyframes star-twinkle {
      0%, 100% { opacity: 0.16; }
      50% { opacity: 0.85; }
    }
    @keyframes star-debug {
      0%, 100% { opacity: 0.04; transform: scale(1); }
      50% { opacity: 1; transform: scale(2.6); }
    }

    @media (prefers-reduced-motion: reduce) {
      #atmosphere circle { animation: none; }
    }

    /* An explicit debug preview may override the system motion preference. */
    #debug-motion:target circle {
      animation-name: star-debug;
      animation-duration: 1.8s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
  ]]></style>
