<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="100%"
     role="img" aria-labelledby="stars-title stars-description"
     style="background:#000000;pointer-events:none">
  <title id="stars-title">Twinkling night sky</title>
  <desc id="stars-description">96 randomly positioned grayscale stars spread across the full viewport. Ten randomly selected stars slowly twinkle with independent timing and changing brightness patterns while the rest stay steady. Reduced motion pauses twinkling; the debug-motion fragment enables stronger brightness pulses on the same ten stars.</desc>
  <style><![CDATA[
    #atmosphere circle {
      opacity: 0.5;
    }
    #atmosphere .twinkle {
      animation: star-twinkle var(--twinkle-duration, 80s) ease-in-out var(--twinkle-delay, 0s) infinite;
    }

    @keyframes star-twinkle {
      0%, 10%, 84%, 100% { opacity: 0.5; }
      28% { opacity: var(--twinkle-dim, 0.45); }
      50% { opacity: var(--twinkle-peak, 0.58); }
      68% { opacity: var(--twinkle-afterglow, 0.5); }
    }
    @keyframes star-debug {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    @media (prefers-reduced-motion: reduce) {
      #atmosphere .twinkle { animation: none; }
    }

    /* An explicit debug preview may override the system motion preference. */
    #debug-motion:target .twinkle {
      animation: star-debug var(--twinkle-duration, 80s) ease-in-out var(--twinkle-delay, 0s) infinite;
    }
  ]]></style>
