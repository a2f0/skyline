<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Chicago Skyline — Living Night</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
        font-family: Georgia, "Times New Roman", serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      main {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      .stars,
      .scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
      }

      .stars {
        z-index: 0;
        pointer-events: none;
      }

      .scene {
        z-index: 1;
      }

      .controls {
        position: fixed;
        z-index: 2;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: center;
        gap: 10px clamp(18px, 2vw, 28px);
        width: max-content;
        max-width: calc(100% - 24px);
        transform: translateX(-50%);
        color: #fff;
        font-size: clamp(18px, 1.85vw, 26px);
        line-height: 1;
        white-space: nowrap;
      }

      .controls button,
      .controls a {
        appearance: none;
        margin: 0;
        border: 0;
        border-radius: 0;
        padding: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: inherit;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        cursor: pointer;
        opacity: 0.88;
      }

      .controls button:hover,
      .controls a:hover,
      .controls button:focus-visible,
      .controls a:focus-visible,
      .controls button[aria-pressed="true"] {
        color: #fff;
        opacity: 1;
        text-decoration-thickness: 2px;
      }

      .controls button:focus-visible,
      .controls a:focus-visible {
        outline: 1px solid #fff;
        outline-offset: 6px;
      }

      .motion-status {
        flex-basis: 100%;
        margin: 0;
        color: #999;
        font: 12px/1.5 system-ui, sans-serif;
        text-align: center;
        white-space: normal;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 520px) {
        .controls {
          top: max(16px, env(safe-area-inset-top));
          gap: 10px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <iframe
        class="stars"
        id="stars"
        src="stars.svg"
        title="Twinkling night sky"
        aria-hidden="true"
        tabindex="-1"
      ></iframe>
      <iframe
        class="scene"
        id="scene"
        src="skyline-animated.svg"
        title="Animated Chicago skyline at night"
      ></iframe>

      <nav class="controls" aria-label="Skyline controls">
        <button type="button" id="fullscreen" aria-pressed="false">fullscreen</button>
        <button type="button" id="debug-motion" aria-pressed="false" aria-describedby="motion-status">debug motion</button>
        <p class="motion-status" id="motion-status" role="status">Checking motion preference…</p>
      </nav>

      <p class="visually-hidden" id="status" aria-live="polite"></p>
    </main>

    <script>
      const fullscreenButton = document.querySelector("#fullscreen");
      const status = document.querySelector("#status");
      const stars = document.querySelector("#stars");
      const debugMotionButton = document.querySelector("#debug-motion");
      const motionStatus = document.querySelector("#motion-status");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let debugMotion = false;

      function updateMotionStatus() {
        const preference = reducedMotion.matches ? "reduced" : "allowed";
        const animation = debugMotion
          ? (reducedMotion.matches ? "debug override active" : "debug animation")
          : (reducedMotion.matches ? "stars paused" : "stars twinkling");
        motionStatus.textContent = `System motion: ${preference} · ${animation}`;
        debugMotionButton.textContent = debugMotion ? "stop debug" : "debug motion";
        debugMotionButton.setAttribute("aria-pressed", String(debugMotion));
        debugMotionButton.title = debugMotion
          ? "Return to the system motion setting"
          : "Preview larger, faster-pulsing stars, even when reduced motion is enabled";
      }

      debugMotionButton.addEventListener("click", () => {
        debugMotion = !debugMotion;
        // A fragment works for both hosted pages and files opened directly.
        stars.src = `stars.svg${debugMotion ? "#debug-motion" : ""}`;
        updateMotionStatus();
      });

      reducedMotion.addEventListener("change", updateMotionStatus);
      updateMotionStatus();

      async function toggleFullscreen() {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen();
          }
        } catch {
          status.textContent = "Fullscreen is not available in this browser";
        }
      }

      fullscreenButton.addEventListener("click", toggleFullscreen);

      document.addEventListener("fullscreenchange", () => {
        const isFullscreen = Boolean(document.fullscreenElement);
        fullscreenButton.textContent = isFullscreen ? "exit fullscreen" : "fullscreen";
        fullscreenButton.setAttribute("aria-pressed", String(isFullscreen));
        status.textContent = isFullscreen ? "Fullscreen enabled" : "Fullscreen exited";
      });

      if (!document.fullscreenEnabled) {
        fullscreenButton.hidden = true;
      }

      document.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "f" && !event.metaKey && !event.ctrlKey && !event.altKey) {
          event.preventDefault();
          toggleFullscreen();
        }
      });
    </script>
  </body>
</html>
