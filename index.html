<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Chicago Skyline — Living Night</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
        font-family: Georgia, "Times New Roman", serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      main {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      .scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }

      .controls {
        position: fixed;
        z-index: 2;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: clamp(18px, 2vw, 28px);
        transform: translateX(-50%);
        color: #fff;
        font-size: clamp(18px, 1.85vw, 26px);
        line-height: 1;
        white-space: nowrap;
      }

      .controls button,
      .controls a {
        appearance: none;
        margin: 0;
        border: 0;
        border-radius: 0;
        padding: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: inherit;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        cursor: pointer;
        opacity: 0.88;
      }

      .controls button:hover,
      .controls a:hover,
      .controls button:focus-visible,
      .controls a:focus-visible,
      .controls button[aria-pressed="true"] {
        color: #fff;
        opacity: 1;
        text-decoration-thickness: 2px;
      }

      .controls button:focus-visible,
      .controls a:focus-visible {
        outline: 1px solid #fff;
        outline-offset: 6px;
      }

      .loading {
        position: fixed;
        inset: auto 0 20px;
        z-index: 0;
        margin: 0;
        color: #777;
        font: 13px/1.4 system-ui, sans-serif;
        letter-spacing: 0.12em;
        text-align: center;
        text-transform: uppercase;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 520px) {
        .controls {
          top: max(16px, env(safe-area-inset-top));
          gap: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <p class="loading" aria-hidden="true">Chicago after dark</p>
      <object
        class="scene"
        id="scene"
        data="skyline-animated.svg"
        type="image/svg+xml"
        aria-label="Animated Chicago skyline at night"
      >
        <a href="skyline-animated.svg">Open the animated Chicago skyline</a>
      </object>

      <nav class="controls" aria-label="Skyline controls">
        <button type="button" id="fullscreen" aria-pressed="false">fullscreen</button>
      </nav>

      <p class="visually-hidden" id="status" aria-live="polite"></p>
    </main>

    <script>
      const fullscreenButton = document.querySelector("#fullscreen");
      const status = document.querySelector("#status");

      async function toggleFullscreen() {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen();
          }
        } catch {
          status.textContent = "Fullscreen is not available in this browser";
        }
      }

      fullscreenButton.addEventListener("click", toggleFullscreen);

      document.addEventListener("fullscreenchange", () => {
        const isFullscreen = Boolean(document.fullscreenElement);
        fullscreenButton.textContent = isFullscreen ? "exit fullscreen" : "fullscreen";
        fullscreenButton.setAttribute("aria-pressed", String(isFullscreen));
        status.textContent = isFullscreen ? "Fullscreen enabled" : "Fullscreen exited";
      });

      if (!document.fullscreenEnabled) {
        fullscreenButton.hidden = true;
      }

      document.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "f" && !event.metaKey && !event.ctrlKey && !event.altKey) {
          event.preventDefault();
          toggleFullscreen();
        }
      });
    </script>
  </body>
</html>
